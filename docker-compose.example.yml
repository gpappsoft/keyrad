# Example only — copy/adjust paths and image.
#
# Secrets via environment variables: client_id/client_secret are read from the shell
# (or a .env file) and injected, so the mounted keyrad.yaml can stay free of plaintext
# credentials (its values may be left empty or as "<>"). ENV wins over YAML.
services:
  keyrad:
    image: gpappsoft/keyrad:latest
    container_name: keyrad_svc
    volumes:
      - ./keyrad.yaml:/app/keyrad.yaml:ro
      - ./clients.conf:/app/clients.conf:ro
    environment:
      KEYRAD_KEYCLOAK_CLIENT_ID: "${KEYCLOAK_CLIENT_ID:?set KEYCLOAK_CLIENT_ID in .env}"
      KEYRAD_KEYCLOAK_CLIENT_SECRET: "${KEYCLOAK_CLIENT_SECRET:?set KEYCLOAK_CLIENT_SECRET in .env}"
      # Optional overrides:
      # KEYRAD_KEYCLOAK_TOKEN_URL: "${KEYCLOAK_TOKEN_URL}"
      # KEYRAD_KEYCLOAK_REALM: "${KEYCLOAK_REALM}"
      # KEYRAD_KEYCLOAK_API_URL: "${KEYCLOAK_API_URL}"
      # KEYRAD_KEYCLOAK_INSECURE_SKIP_TLS_VERIFY: "${KEYCLOAK_INSECURE_SKIP_TLS_VERIFY:-false}"
      # Override a RADIUS shared secret from clients.conf per client key, e.g.:
      # KEYRAD_RADIUS_CLIENT_SECRET_127_0_0_1: "${NAS_SHARED_SECRET}"
    restart: always
    #ports:
    #  - "1812:1812/udp"
    # Optional: more verbose logs (RADIUS + Keycloak details).
    command: ["/app/keyrad", "-debug", "-c", "/app/keyrad.yaml", "-r", "/app/clients.conf"]
    # Linux: to see real NAS source IPs (and avoid NAT changing the client IP), you can instead use:
    network_mode: "host"
    # and remove `ports:` (keyrad binds 0.0.0.0:1812 on the host network stack).
