# Keycloak settings. client_id/client_secret are secrets; token_url, realm and api_url are
# the endpoints keyrad talks to. ALL FIVE are required: if any is left empty or as the "<>"
# placeholder below, keyrad refuses to start. token_url and api_url must be complete URLs
# that already contain your realm (e.g. ".../realms/master/..."), because keyrad never
# inserts `realm` into them.
#
# Secrets via environment variables (ENV wins over YAML):
#   client_id     -> KEYRAD_KEYCLOAK_CLIENT_ID
#   client_secret -> KEYRAD_KEYCLOAK_CLIENT_SECRET
#   token_url     -> KEYRAD_KEYCLOAK_TOKEN_URL
#   realm         -> KEYRAD_KEYCLOAK_REALM
#   api_url       -> KEYRAD_KEYCLOAK_API_URL
# For Docker/Kubernetes, keep this file free of plaintext secrets: leave the secret values
# empty ("") or as "<>" below and export the variables instead. If neither YAML nor ENV
# resolves every required field, keyrad refuses to start. See README, "Secrets via
# Environment Variables".
token_url: "https://<>/realms/<>/protocol/openid-connect/token"
client_id: "<>"
client_secret: "<>"
realm: "<>"
api_url: "https://<>/admin/realms/<>" # this is the admin API URL

# insecure_skip_tls_verify -> KEYRAD_KEYCLOAK_INSECURE_SKIP_TLS_VERIFY (true/false)
insecure_skip_tls_verify: false
otp_challenge_message: "Please enter your OTP code"

# RADIUS attribute mappings based on user roles/groups/scopes.
# Each scope key maps to a list of attributes (standard or vendor-specific).
# Scope keys are matched against Keycloak realm roles, groups, and OAuth2 scopes.
# Use "re:" prefix for regex matching (e.g. "re:^group_.*").
#
# Attribute fields:
#   vendor:     Vendor ID (omit or 0 for standard attributes)
#   attribute:  Attribute type number
#   value:      Attribute value
#   value_type: "string" (default), "integer", or "ipaddr"
scope_radius_map:
  admin:
    - attribute: 6        # Service-Type
      value: "6"          # Administrative-User
      value_type: integer
  vpn:
    - attribute: 8        # Framed-IP-Address
      value: "10.0.0.1"
      value_type: ipaddr
    - vendor: 14988       # MikroTik
      attribute: 3        # Mikrotik-Group
      value: "full"
  wifi:
    - attribute: 64       # Tunnel-Type
      value: "13"         # VLAN
      value_type: integer
    - vendor: 14988       # MikroTik
      attribute: 8        # Mikrotik-Rate-Limit
      value: "10M/10M"
  group_admins:
    - attribute: 11       # Filter-Id
      value: "admins"
  re:^group_.*:
    - attribute: 11       # Filter-Id
      value: "group-member"

listen_addr: "127.0.0.1:1812"
